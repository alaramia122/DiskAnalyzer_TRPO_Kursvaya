name: Generate final coursework report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-report:
    name: Generate and validate DOCX
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install report dependency
        run: python -m pip install --disable-pip-version-check python-docx

      - name: Generate report
        run: |
          python scripts/generate_final_report.py --output dist/Отчет_курсовая_ТРПО_DiskAnalyzer.docx
          test -s dist/Отчет_курсовая_ТРПО_DiskAnalyzer.docx
          test -s dist/Отчет_курсовая_ТРПО_DiskAnalyzer.manifest.txt

      - name: Upload report and inventory
        uses: actions/upload-artifact@v4
        with:
          name: DiskAnalyzer-final-report
          path: |
            dist/Отчет_курсовая_ТРПО_DiskAnalyzer.docx
            dist/Отчет_курсовая_ТРПО_DiskAnalyzer.manifest.txt
          if-no-files-found: error
          retention-days: 30
